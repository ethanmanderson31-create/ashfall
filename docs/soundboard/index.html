<style>
/* Layout: a single column of event "cards" grouped by category, gilded like the in-game Tarot of Embers. Single dark theme by design. */
:root {
  --bg: #0d0a09; --panel: #171211; --panel-2: #1f1816; --line: #4a3a2a;
  --gold: #e8c27a; --gold-dim: #a88a55; --text: #efe6d6; --muted: #a89a86; --ember: #ff7a2e;
  --display: "Cinzel", "Trajan Pro", Georgia, serif; --body: "EB Garamond", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }
.wrap { max-width: 980px; margin: 0 auto; }
header { padding-block: 48px 24px; text-align: center; }
h1 { font-family: var(--display); font-weight: 700; color: var(--gold); font-size: clamp(34px, 6vw, 54px); margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
header p { color: var(--muted); max-width: 60ch; margin: 10px auto 0; font-style: italic; }
h2 { font-family: var(--display); color: var(--gold); font-weight: 500; font-size: 24px; letter-spacing: 0.08em; margin: 44px 0 14px; display: flex; align-items: center; gap: 14px; }
h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.slot { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; margin-bottom: 12px; position: relative; }
.slot::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(232, 194, 122, 0.14); border-radius: 7px; pointer-events: none; }
.slot-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.slot-head h3 { font-family: var(--display); font-weight: 500; font-size: 19px; margin: 0; color: var(--text); letter-spacing: 0.03em; }
.slot-head .use { color: var(--muted); font-size: 16px; min-width: 0; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid #2e2420;
  border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--gold-dim); }
.opt.picked { border-color: var(--gold); background: #2a1f17; box-shadow: inset 0 0 0 1px rgba(232, 194, 122, 0.35); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold-dim); background: #120d0b; color: var(--gold); cursor: pointer;
  display: grid; place-items: center; font-size: 15px; flex: none; }
.play:hover, .play:focus-visible { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(255, 122, 46, 0.25); }
.play.on { background: var(--ember); color: #1a0d05; border-color: var(--ember); }
.opt-text { min-width: 0; }
.opt-label { font-family: var(--display); font-size: 15px; color: var(--gold); letter-spacing: 0.04em; }
.opt-label .k { color: var(--muted); margin-right: 6px; }
.opt-desc { color: var(--muted); font-size: 15px; line-height: 1.35; }
.opt-n { color: var(--gold-dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.only { color: var(--muted); font-size: 14px; font-style: italic; }
.badge { font-family: var(--display); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bg); background: var(--ember); border-radius: 4px; padding: 2px 7px; vertical-align: 2px; font-style: normal; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(13, 10, 9, 0.96); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-inner { max-width: 980px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar-inner .summary { flex: 1; min-width: 0; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.bar button { font-family: var(--display); letter-spacing: 0.06em; font-size: 14px; color: #1a0d05; background: var(--gold); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
.bar button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
textarea { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-family: var(--body); font-size: 15px; padding: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</div>

const picks = {};
try { Object.assign(picks, JSON.parse(localStorage.getItem("ashfall-sound-picks-2") || "{}")); } catch (e) {}
let current = null;
function stopAll() {
  if (current) { current.cancelled = true; current.audios.forEach(a => { a.pause(); a.currentTime = 0; }); if (current.btn) current.btn.classList.remove("on"); }
  current = null;
}
function playOpt(opt, btn) {
  const wasMine = current && current.btn === btn;
  stopAll();
  if (wasMine) return;
  const job = { cancelled: false, audios: [], btn };
  current = job; btn.classList.add("on");
  const files = opt.seq ? opt.files : [opt.files[Math.floor(Math.random() * opt.files.length)]];
  let i = 0;
  const next = () => {
    if (job.cancelled) return;
    if (i >= files.length) { btn.classList.remove("on"); if (current === job) current = null; return; }
    const a = new Audio(files[i++]);
    job.audios.push(a);
    a.onended = () => setTimeout(next, opt.seq ? 120 : 0);
    a.onerror = next;
    a.play().catch(next);
  };
  next();
}
function render() {
  const board = document.getElementById("board");
  DATA.forEach(cat => {
    const h = document.createElement("h2"); h.textContent = cat.cat; board.appendChild(h);
    cat.slots.forEach(slot => {
      const s = document.createElement("section"); s.className = "slot";
      const head = document.createElement("div"); head.className = "slot-head";
      head.innerHTML = `<h3></h3><span class="use"></span>`;
      head.querySelector("h3").textContent = slot.name; head.querySelector(".use").textContent = slot.use;
      if (slot.isnew) { const b = document.createElement("span"); b.className = "badge"; b.textContent = "New"; head.querySelector("h3").append(" ", b); }
      s.appendChild(head);
      const opts = document.createElement("div"); opts.className = "opts";
      if (!slot.options.some(o => o.key === picks[slot.id])) picks[slot.id] = slot.pick || slot.options[0].key;
      slot.options.forEach(opt => {
        const lab = document.createElement("label"); lab.className = "opt";
        const id = `opt-${slot.id}-${opt.key}`;
        lab.htmlFor = id;
        const input = document.createElement("input"); input.type = "radio"; input.name = slot.id; input.id = id; input.value = opt.key;
        input.checked = picks[slot.id] === opt.key;
        const btn = document.createElement("button"); btn.type = "button"; btn.className = "play"; btn.setAttribute("aria-label", `Play ${slot.name}, option ${opt.key}`); btn.textContent = "▶";
        btn.addEventListener("click", ev => { ev.preventDefault(); ev.stopPropagation(); playOpt(opt, btn); });
        const txt = document.createElement("div"); txt.className = "opt-text";
        const n = opt.files.length;
        txt.innerHTML = `<div class="opt-label"><span class="k"></span><span class="l"></span></div><div class="opt-desc"></div><div class="opt-n"></div>`;
        txt.querySelector(".k").textContent = slot.options.length > 1 ? opt.key : "";
        txt.querySelector(".l").textContent = opt.label;
        txt.querySelector(".opt-desc").textContent = opt.desc;
        txt.querySelector(".opt-n").textContent = n > 1 ? (opt.seq ? `${n} sounds in sequence` : `${n} variants · plays a random one`) : "";
        lab.append(input, btn, txt);
        input.addEventListener("change", () => { picks[slot.id] = opt.key; save(); mark(opts, slot.id); });
        opts.appendChild(lab);
      });
      s.appendChild(opts);
      if (slot.options.length === 1) {
        const o = document.createElement("div"); o.className = "only"; o.textContent = "One option. Tell me if you'd like alternatives."; s.appendChild(o);
      }

  });
}
function mark(opts, id) { opts.querySelectorAll(".opt").forEach(l => l.classList.toggle("picked", l.querySelector("input").value === picks[id])); }
function text() {
  const parts = [];
  DATA.forEach(c => c.slots.forEach(s => { if (s.options.length > 1) parts.push(`${s.name}: ${picks[s.id]}`); }));
  return "Sound picks: " + parts.join(", ");
}
function save() { try { localStorage.setItem("ashfall-sound-picks-2", JSON.stringify(picks)); } catch (e) {} document.getElementById("summary").textContent = text(); }

  const t = text(), b = document.getElementById("copy");
  navigator.clipboard.writeText(t).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy my picks", 1500); })

});
